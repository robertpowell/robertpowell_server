[Definition]

# Shell and RCE probe detection
# Catches path traversal, CGI abuse, command injection, and framework exploits

failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT) /+cgi-bin/.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) .*\.cgi\b.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) .*\/bin\/sh.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) .*\/bin\/bash.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) .*\.%%2e.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) .*%%%%32%%65.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) .*(cmd|command|exec)=.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) .*invokefunction.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+__debug__/.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+actuator.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+console/.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+jenkins.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+hudson.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+manager/html.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+solr/.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+remote/login.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+\.well-known/security\.txt.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+api/v\d+/.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+jmx-console.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+web-console.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+invoke.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+setup\.cgi.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+HNAP1.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+tmUnblock\.cgi.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+sdk/.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+_ignition/.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+geoserver/.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) /+global-protect/.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) .*allow_url_include.*$
            ^<HOST> -.*"(GET|POST|HEAD|PUT) .*auto_prepend_file.*$
            ^<HOST> -.*"PROPFIND .*$

ignoreregex =
