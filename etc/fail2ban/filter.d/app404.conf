[Definition]
# Any 404 counts, except the requests every browser and crawler makes by default,
# which are noise rather than probing (a real visitor's browser 404'd favicon.ico
# three times and got the owner banned on 2026-09-04).
failregex = ^<HOST> - -.* "(GET|POST|HEAD).*HTTP.*" 404 .*$
ignoreregex = "(GET|HEAD) /(favicon\.ico|robots\.txt|sitemap\.xml|apple-touch-icon[^ ]*|browserconfig\.xml|site\.webmanifest|manifest\.json|\.well-known/[^ ]*) 
