            ^<HOST> -.*"(GET|POST|HEAD) /cisco/.*$
            ^<HOST> -.*"(GET|POST|HEAD) /config.*/.*$
            ^<HOST> -.*"(GET|POST|HEAD) /firmware/.*$
            ^<HOST> -.*"(GET|POST|HEAD) /linksys/.*$
            ^<HOST> -.*"(GET|POST|HEAD) /login\.cgi.*$
