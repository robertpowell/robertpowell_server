            # 2026-10-31: WordPress REST-API discovery probes (45.148.10.42 walked
            # /wp-json/, ?rest_route=/ and /wp/, /wordpress/, /cms/... on the blog
            # unbanned). No site on this box is WordPress, so any of these is a scanner.
            ^<HOST> -.*"(GET|POST|HEAD) /[^ ]*wp-json(/|$| |\?).*$
            ^<HOST> -.*"(GET|POST|HEAD) /[^ ]*\?rest_route=.*$
            ^<HOST> -.*"(GET|POST|HEAD) /+(wp|wordpress)(/|$| |\?).*$
            ^<HOST> -.*"(GET|POST|HEAD) /[^ ]*wp-content/.*$

