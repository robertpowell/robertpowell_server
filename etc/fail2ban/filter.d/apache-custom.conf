            ^<HOST> -.*"(GET|POST|HEAD) /wwwroot\.rar.*$
            ^<HOST> -.*"(GET|POST|HEAD) http:.*/[pP][hH][pP][mM][yY][aA][dD][mM][iI][nN].*$
            ^<HOST> -.*"POST /rpc/trackback/.*$
            ^<HOST> -.*"(GET|POST|HEAD) /+pma(/|$).*$
            ^<HOST> -.*"(GET|POST|HEAD) /+typo3(/|$).*$
            ^<HOST> -.*"(GET|POST|HEAD) /+xampp(/|$).*$
            ^<HOST> -.*"(GET|POST|HEAD) /+wp-signup\.php.*$
            ^<HOST> -.*"(GET|POST|HEAD) /+wp-admin(/|$).*$
