[Definition]
# Contact forms on every vhost: 403 = failed human/token check or honeypot, 429 = rate limited.
# Matches both "combined" and "vhost_combined" (optional leading "host:port ") log formats.
failregex = ^(?:\S+:\d+ )?<HOST> - - \[.*\] "POST /contact\.php[^"]*" (?:403|429) .*$
ignoreregex =
