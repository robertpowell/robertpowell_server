# apache-probe: ONE jail for single-hit probes on paths that are never legitimate on this box.
# Adopted 2026-10-31 from the ropo.uk box (its ROP-329/330 consolidation of apache-env/-traversal/
# -shellprobe/-scanner/-wordpress), replacing this box's shellprobe, connect and php-url-fopen jails
# and the path patterns of apache-custom (which keeps only the bad-user-agent patterns).
#
# Differences from ropo's filter:
#  * every line starts ^(?:\S+:\d+ )?<HOST> so it also reads the vhost_combined logs
#    (highlyconfidential / robertpowell.net / rpowell / ultrasecret / other_vhosts), which no
#    probe jail here watched before;
#  * the webshell basenames are anchored to a path segment: ropo's "[^ "]*t\.php" also matched
#    /contact.php and would have banned every visitor to the contact pages (incl. RP and Googlebot);
#  * ropo's two fileupload-app patterns dropped (no such app here);
#  * this box's own extras appended at the end (cgi-bin, .cgi, /wp /wordpress dirs, squid, router /
#    appliance / framework paths, allow_url_include, remote-URL parameter, PROPFIND, bare "\n" request).
# Patterns match the request line only, never the referrer or user agent (a UA match is apache-custom's job).
# Tested by replaying 30 days of every access log: 0 ignoreip hits, 0 /contact.php hits, 0 major-crawler hits.

[Definition]
failregex = ^(?:\S+:\d+ )?<HOST> .* "(GET|POST|HEAD) /+\.env[^\s]*
