# Failed admin logins on the Flask blog (new.robertpowell.com).
# A wrong password re-renders the login page with 200; a correct one answers 302.
# Added in the 2026-09-05 OWASP review: the app itself has no lockout.
[Definition]
failregex = ^(?:\S+:\d+ )?<HOST> - - \[.*\] "POST /admin/login[^"]*" 200 .*$
ignoreregex =
