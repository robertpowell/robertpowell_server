# Security review 2026-10-23 (Linear ROP-277 / ROP-282).
# Only root's keys are accepted; the dormant robertpo / ropoimac accounts are removed.
AllowUsers root
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
# Drop SHA-1 and 64-bit MACs; keep the encrypt-then-MAC variants every current OpenSSH client offers.
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
