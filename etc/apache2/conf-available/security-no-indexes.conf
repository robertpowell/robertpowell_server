# Disable directory listings for every site under /var/www.
#
# apache2.conf's <Directory /var/www/> block sets "Options Indexes FollowSymLinks",
# which makes any directory lacking an index file publicly browsable. This file is
# loaded from conf-enabled/ (apache2.conf line ~222), i.e. AFTER that block, so it
# overrides it globally.
#
# Only "-Indexes" is set, so it merges: FollowSymLinks and any other inherited
# Options are preserved. Per-vhost <Directory> blocks are more specific and still win.
#
# Added 2026-08-25 after a browsable listing was found at robertpowell.net/Z-DocArc/.
<Directory /var/www/>
    Options -Indexes
</Directory>
