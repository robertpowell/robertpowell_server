# Catch-all default vhost for unmatched hostnames (direct-IP hits, scanners, bots).
# Named 000- so it sorts first and becomes the default vhost on each port,
# instead of mta-sts.rpowell.co.uk. Returns 403 and serves nothing.
# Legitimate clients always send a matching Host/SNI and are unaffected.

<VirtualHost *:80>
    ServerName catch-all.invalid
    DocumentRoot /var/www/catch-all

    <Directory /var/www/catch-all>
        AllowOverride None
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName catch-all.invalid
    DocumentRoot /var/www/catch-all

    <Directory /var/www/catch-all>
        AllowOverride None
        Require all denied
    </Directory>

    SSLEngine on
    # Neutral self-signed cert (CN=localhost) for requests that match no site. The old snakeoil
    # pair carried a former client's name in its CN (2026-09-05 OWASP review); Postfix still uses it.
    SSLCertificateFile /etc/ssl/catch-all/cert.pem
    SSLCertificateKeyFile /etc/ssl/catch-all/key.pem

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
</IfModule>
