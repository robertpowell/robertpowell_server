<VirtualHost *:80>
    ServerName rpowell.co.uk
    ServerAlias www.rpowell.co.uk

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
RewriteCond %{SERVER_NAME} =rpowell.co.uk [OR]
RewriteCond %{SERVER_NAME} =www.rpowell.co.uk
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    # per-site copy for the visitor report
    CustomLog ${APACHE_LOG_DIR}/rpowell.co.uk-access.log vhost_combined
</VirtualHost>

<VirtualHost *:443>
    ServerName rpowell.co.uk
    ServerAlias www.rpowell.co.uk

    DocumentRoot /var/www/rpowell.co.uk/public_html

    Protocols h2 http/1.1

    <Directory /var/www/rpowell.co.uk/public_html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # OWASP security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    Header always set X-Permitted-Cross-Domain-Policies "none"

    # Disable server signature
    ServerSignature Off

    # SSL will be configured by Certbot below this line
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/rpowell.co.uk/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/rpowell.co.uk/privkey.pem
    # per-site copy for the visitor report
    CustomLog ${APACHE_LOG_DIR}/rpowell.co.uk-access.log vhost_combined
</VirtualHost>
