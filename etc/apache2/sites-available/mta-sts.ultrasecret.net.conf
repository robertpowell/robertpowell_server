# mta-sts.ultrasecret.net — MTA-STS policy host
# Consolidated from mta-sts.ultrasecret.net.conf + mta-sts.ultrasecret.net-le-ssl.conf
# NOTE: this host serves ONLY the MTA-STS policy. It is deliberately independent
# of where ultrasecret.net's website and mail live — the policy host just has to answer
# https://mta-sts.ultrasecret.net/.well-known/mta-sts.txt with a valid certificate.

<VirtualHost *:80>
    ServerName mta-sts.ultrasecret.net

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName mta-sts.ultrasecret.net

    DocumentRoot /var/www/mta-sts.ultrasecret.net/public_html

    Protocols h2 http/1.1

    <Directory /var/www/mta-sts.ultrasecret.net/public_html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/mta-sts.ultrasecret.net/public_html/.well-known>
        Require all granted
    </Directory>

    <LocationMatch "/.well-known/mta-sts.txt">
        Header set Content-Type "text/plain; charset=utf-8"
    </LocationMatch>

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ServerSignature Off

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/mta-sts.ultrasecret.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mta-sts.ultrasecret.net/privkey.pem
</VirtualHost>
