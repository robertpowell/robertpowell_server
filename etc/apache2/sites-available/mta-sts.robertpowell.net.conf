# mta-sts.robertpowell.net — MTA-STS policy host
# Consolidated from mta-sts.robertpowell.net.conf + mta-sts.robertpowell.net-le-ssl.conf

<VirtualHost *:80>
    ServerName mta-sts.robertpowell.net

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName mta-sts.robertpowell.net

    DocumentRoot /var/www/mta-sts.robertpowell.net/public_html

    Protocols h2 http/1.1

    <Directory /var/www/mta-sts.robertpowell.net/public_html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Ensure .well-known is accessible
    <Directory /var/www/mta-sts.robertpowell.net/public_html/.well-known>
        Require all granted
    </Directory>

    # Correct MIME type for mta-sts.txt
    <LocationMatch "/.well-known/mta-sts.txt">
        Header set Content-Type "text/plain; charset=utf-8"
    </LocationMatch>

    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ServerSignature Off

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/mta-sts.robertpowell.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mta-sts.robertpowell.net/privkey.pem
</VirtualHost>
