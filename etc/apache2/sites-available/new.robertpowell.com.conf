# new.robertpowell.com — TEMPORARY staging host for the Flask blog.
# Delete this vhost and the Cloudflare A record after cutover to the apex.

<VirtualHost *:80>
    ServerName new.robertpowell.com
    DocumentRoot /var/www/new.robertpowell.com

    <Directory /var/www/new.robertpowell.com>
        AllowOverride None
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog  ${APACHE_LOG_DIR}/new.robertpowell.com-error.log
    CustomLog ${APACHE_LOG_DIR}/new.robertpowell.com-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName new.robertpowell.com
    DocumentRoot /var/www/new.robertpowell.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/new.robertpowell.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/new.robertpowell.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Staging only — keep it out of search results entirely.
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # OWASP review 2026-09-05. All script lives in /static/theme.js and contact.js, so no inline
    # hashes are needed; keep it that way (any inline <script> will be blocked).
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    # drop gunicorn's banner from proxied responses
    Header unset Server

    # Static assets straight from the app package; everything else proxied.
    Alias /static/ /opt/ropo-blog/app/static/
    <Directory /opt/ropo-blog/app/static>
        AllowOverride None
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=3600"
    </Directory>

    # Recovered archive images, served straight from disk.
    Alias /media/ /opt/ropo-blog/data/media/
    <Directory /opt/ropo-blog/data/media>
        AllowOverride None
        Require all granted
        Options -Indexes
        Header set Cache-Control "public, max-age=86400"
    </Directory>

    # Temporary design preview, served from disk.
    Alias /logos/ /var/www/new.robertpowell.com/logos/
    <Directory /var/www/new.robertpowell.com/logos>
        AllowOverride None
        Require all granted
        Options -Indexes
        DirectoryIndex index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /static/ !
    ProxyPass        /media/ !
    ProxyPass        /logos/ !
    # contact form + privacy page are served by Apache/PHP from the DocumentRoot, not the blog
    ProxyPass        /contact.php !
    ProxyPass        /contact.js !
    ProxyPass        /privacy.php !
    ProxyPass        / http://127.0.0.1:8404/ retry=1
    ProxyPassReverse / http://127.0.0.1:8404/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog  ${APACHE_LOG_DIR}/new.robertpowell.com-error.log
    CustomLog ${APACHE_LOG_DIR}/new.robertpowell.com-access.log combined
</VirtualHost>
