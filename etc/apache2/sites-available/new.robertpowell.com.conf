# new.robertpowell.com — was the staging host for the Flask blog until the 25 Nov 2026 flip.
# Now only a permanent redirect to https://robertpowell.com so bookmarks and shared links still land.
# ROP-24: after about a month delete this vhost, its certificate and the `new` DNS records.

<VirtualHost *:80>
    ServerName new.robertpowell.com
    RewriteEngine On
    RewriteRule ^ https://robertpowell.com%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog  ${APACHE_LOG_DIR}/new.robertpowell.com-error.log
    CustomLog ${APACHE_LOG_DIR}/new.robertpowell.com-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName new.robertpowell.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/new.robertpowell.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/new.robertpowell.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    RewriteEngine On
    RewriteRule ^ https://robertpowell.com%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog  ${APACHE_LOG_DIR}/new.robertpowell.com-error.log
    CustomLog ${APACHE_LOG_DIR}/new.robertpowell.com-access.log combined
</VirtualHost>
