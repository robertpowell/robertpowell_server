# mpowell.uk — alias of mpowell.co.uk: every request is redirected to https://mpowell.co.uk/
# Added 2026-11-24 (RP: "point mpowell.uk at the same mpowell.co.uk site"). No docroot of its own.
# Certificate: Let's Encrypt via the dns-cloudflare plugin (DNS-01); renew_hook reloads Apache.

<VirtualHost *:80>
    ServerName mpowell.uk
    ServerAlias www.mpowell.uk
    ServerAdmin webmaster@localhost

    RewriteEngine On
    RewriteRule ^ https://mpowell.co.uk%{REQUEST_URI} [END,NE,R=permanent]
    # logged with the site it points at, for the visitor report
    CustomLog ${APACHE_LOG_DIR}/mpowell.co.uk-access.log vhost_combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName mpowell.uk
    ServerAlias www.mpowell.uk
    ServerAdmin webmaster@localhost

    Protocols h2 http/1.1

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    CustomLog ${APACHE_LOG_DIR}/mpowell.co.uk-access.log vhost_combined

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    RewriteEngine On
    RewriteRule ^ https://mpowell.co.uk%{REQUEST_URI} [END,NE,R=permanent]

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/mpowell.uk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mpowell.uk/privkey.pem
</VirtualHost>
</IfModule>
