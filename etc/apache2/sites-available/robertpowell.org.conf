# robertpowell.org — static site, moved here from the ropo.uk box 2026-11-05.
# One consolidated file (:80 redirect + :443), same layout as rpowell.co.uk.
# Certificate: Let's Encrypt via the dns-cloudflare plugin (DNS-01, renews
# without touching Apache; the deploy hook reloads it).

<VirtualHost *:80>
    ServerName robertpowell.org
    ServerAlias www.robertpowell.org

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    # per-site copy for the visitor report
    CustomLog ${APACHE_LOG_DIR}/robertpowell.org-access.log vhost_combined
</VirtualHost>

<VirtualHost *:443>
    ServerName robertpowell.org
    ServerAlias www.robertpowell.org

    DocumentRoot /var/www/robertpowell.org/public_html

    Protocols h2 http/1.1

    <Directory /var/www/robertpowell.org/public_html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # OWASP security headers (same strict CSP the site had on ropo.uk: no inline anything)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    Header always set X-Permitted-Cross-Domain-Policies "none"

    ServerSignature Off

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/robertpowell.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/robertpowell.org/privkey.pem
    # per-site copy for the visitor report
    CustomLog ${APACHE_LOG_DIR}/robertpowell.org-access.log vhost_combined
</VirtualHost>
