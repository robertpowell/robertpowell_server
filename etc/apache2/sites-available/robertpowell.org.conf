# robertpowell.org — HTTP -> HTTPS redirect + HTTPS vhost
# Consolidated layout (both ports in one file), same structure as highlyconfidential.co.uk.
# Moved here from the ropo.uk box 2026-11-05. Holding page + contact form (shared /var/www/shared/contact).
# Certificate: Let's Encrypt via the dns-cloudflare plugin (DNS-01); renew_hook reloads Apache.

<VirtualHost *:80>
    ServerName robertpowell.org
    ServerAlias www.robertpowell.org
    ServerAdmin webmaster@localhost

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
    # per-site copy for the visitor report
    CustomLog ${APACHE_LOG_DIR}/robertpowell.org-access.log vhost_combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName robertpowell.org
    ServerAlias www.robertpowell.org
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/robertpowell.org/public_html

    Protocols h2 http/1.1

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    # per-site copy for the visitor report; access.log is left as-is
    CustomLog ${APACHE_LOG_DIR}/robertpowell.org-access.log vhost_combined

    ErrorDocument 404 /404.html
    <Files "404.html">
        <If "-z %{ENV:REDIRECT_STATUS}">
            RedirectMatch 404 ^/404.html$
        </If>
    </Files>

    # Security headers are managed by the site's .htaccess (AllowOverride All)

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/robertpowell.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/robertpowell.org/privkey.pem
</VirtualHost>
</IfModule>
