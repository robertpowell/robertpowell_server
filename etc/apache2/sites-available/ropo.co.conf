# ropo.co — front page in the highlyconfidential.co.uk layout; the original "Time" world-clock page (PHP, 2010-2024,
# moved unchanged from the KDA cPanel host on 2026-11-02) lives at /time/. www.ropo.co serves the same site.
# HTTP -> HTTPS redirect + HTTPS vhost in one file, as on every other site here.

<VirtualHost *:80>
    ServerName ropo.co
    ServerAlias www.ropo.co
    ServerAdmin webmaster@localhost

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<IfFile /etc/letsencrypt/live/ropo.co/fullchain.pem>
<VirtualHost *:443>
    ServerName ropo.co
    ServerAlias www.ropo.co
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/ropo.co/public_html

    Protocols h2 http/1.1

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    # per-site copy for the visitor report; access.log is left as-is
    CustomLog ${APACHE_LOG_DIR}/ropo.co-access.log vhost_combined

    ErrorDocument 404 /404.html
    <Files "404.html">
        <If "-z %{ENV:REDIRECT_STATUS}">
            RedirectMatch 404 ^/404.html$
        </If>
    </Files>

    <Directory /var/www/ropo.co/public_html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    # The "Looking for Ropo.com?" links on the front page go through this redirect so each click is one
    # line in the access log; the daily report counts them per language (en/sv/fi).
    RedirectMatch 302 "^/go/ropo-com(?:/(?:en|sv|fi))?/?$" "https://ropo.com/"

    # The Time page refers to /scripts/script.js by absolute path; serve it from its own folder unchanged.
    Alias /scripts /var/www/ropo.co/public_html/time/scripts
    # Its visit counter and visitor log, and the per-site PHP settings file, are data, not pages.
    <FilesMatch "^(count\.txt|css-count\.txt|log\.txt|\.user\.ini)$">
        Require all denied
    </FilesMatch>

    # No .htaccess here (AllowOverride None), so the usual headers live in the vhost.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000"

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/ropo.co/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ropo.co/privkey.pem
</VirtualHost>
</IfFile>
</IfModule>
