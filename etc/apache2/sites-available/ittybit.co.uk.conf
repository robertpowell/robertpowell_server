# ittybit.co.uk — HTTP -> HTTPS redirect + HTTPS vhost
# Consolidated layout (both ports in one file), same structure as highlyconfidential.co.uk.
# Moved here from the cPanel host 2026-11-23 (DNS: Fastmail -> Cloudflare the same day). Holding page + contact form (shared /var/www/shared/contact).
# Certificate: Let's Encrypt via the dns-cloudflare plugin (DNS-01); renew_hook reloads Apache.

<VirtualHost *:80>
    ServerName ittybit.co.uk
    ServerAlias www.ittybit.co.uk
    ServerAdmin webmaster@localhost

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
    # per-site copy for the visitor report
    CustomLog ${APACHE_LOG_DIR}/ittybit.co.uk-access.log vhost_combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ittybit.co.uk
    ServerAlias www.ittybit.co.uk
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/ittybit.co.uk/public_html

    Protocols h2 http/1.1

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    # per-site copy for the visitor report; access.log is left as-is
    CustomLog ${APACHE_LOG_DIR}/ittybit.co.uk-access.log vhost_combined

    ErrorDocument 404 /404.html
    <Files "404.html">
        <If "-z %{ENV:REDIRECT_STATUS}">
            RedirectMatch 404 ^/404.html$
        </If>
    </Files>

    # Security headers are managed by the site's .htaccess (AllowOverride All)

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/ittybit.co.uk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ittybit.co.uk/privkey.pem
</VirtualHost>
</IfModule>
