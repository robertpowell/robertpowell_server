# highlyconfidential.co.uk — HTTP -> HTTPS redirect + HTTPS vhost
# Consolidated layout (both ports in one file), added 2026-09-03.

<VirtualHost *:80>
    ServerName highlyconfidential.co.uk
    ServerAlias www.highlyconfidential.co.uk
    ServerAdmin webmaster@localhost

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName highlyconfidential.co.uk
    ServerAlias www.highlyconfidential.co.uk
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/highlyconfidential.co.uk/public_html

    Protocols h2 http/1.1

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    # per-site copy for the visitor report; access.log is left as-is
    CustomLog ${APACHE_LOG_DIR}/highlyconfidential.co.uk-access.log vhost_combined

    ErrorDocument 404 /404.html
    <Files "404.html">
        <If "-z %{ENV:REDIRECT_STATUS}">
            RedirectMatch 404 ^/404.html$
        </If>
    </Files>

    # Security headers are managed by the site's .htaccess (AllowOverride All)

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/highlyconfidential.co.uk/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/highlyconfidential.co.uk/privkey.pem
</VirtualHost>
</IfModule>
