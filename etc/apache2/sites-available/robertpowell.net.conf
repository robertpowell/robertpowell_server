# robertpowell.net — HTTP -> HTTPS redirect + HTTPS vhost
# Consolidated from robertpowell.net.conf + robertpowell.net-le-ssl.conf

<VirtualHost *:80>
    ServerName robertpowell.net
    ServerAlias www.robertpowell.net
    ServerAdmin webmaster@localhost

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName robertpowell.net
    ServerAlias www.robertpowell.net
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    Protocols h2 http/1.1

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    # per-site copy for the visitor report; access.log is left as-is
    CustomLog ${APACHE_LOG_DIR}/robertpowell.net-access.log vhost_combined

    ErrorDocument 404 /404.html
    <Files "404.html">
        <If "-z %{ENV:REDIRECT_STATUS}">
            RedirectMatch 404 ^/404.html$
        </If>
    </Files>

    # Security headers are managed by /var/www/html/.htaccess (AllowOverride All)

    # Disable directory listings — apache2.conf sets "Options Indexes" for /var/www,
    # which exposed a browsable listing at /Z-DocArc/
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deny legacy / archive / dev content. None of these call check_allowed_ip.php,
    # so they bypassed the geo-gate entirely.
    <Directory /var/www/html/Z-DocArc>
        Require all denied
    </Directory>
    <Directory /var/www/html/old>
        Require all denied
    </Directory>
    <Directory /var/www/html/devtest>
        Require all denied
    </Directory>

    # Agent/config files in the docroot. These are currently protected ONLY by
    # filesystem permissions (root:root 0600) — a chmod sweep or redeploy would
    # publish them. Deny explicitly so protection does not depend on mode bits.
    <Files "CLAUDE.md">
        Require all denied
    </Files>

    # Dotfiles and dot-directories (.claude, .git, .env, .DS_Store ...).
    # The (?!well-known) guard is essential: certbot's HTTP-01 challenge serves
    # /.well-known/acme-challenge/, and denying it would break cert renewal.
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.(?!well-known)">
        Require all denied
    </FilesMatch>

    # CLI diagnostic script — publicly reachable and fires an ip-api lookup per hit,
    # which lets anyone burn the rate-limited quota the geo-gate depends on.
    <Files "test_allowed.php">
        Require all denied
    </Files>

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/robertpowell.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/robertpowell.net/privkey.pem
</VirtualHost>
</IfModule>
