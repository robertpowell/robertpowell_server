# robertpowell.net (RoPo, 27 Nov 2026): install updates at 04:05-04:15, after the 03:30 restic
# backup and before the 05:00 NDA tests, the 05:20 reboot-manager slot and ropo.uk 07:00 report,
# so a reboot needed by an update happens the same morning.
# Stock timer is 06:00 with up to 60 min random delay, which ran AFTER the reboot slot.
[Timer]
OnCalendar=
OnCalendar=*-*-* 04:05
RandomizedDelaySec=10m
