# Site-specific exclusions, loaded BEFORE the CRS rules. Adopted 2026-10-31 from the ropo.uk box (ROP-340).
# Rule ids 1000-1999 are ours. Add CRS false-positive exclusions found during the DetectionOnly soak here
# (ctl:ruleRemoveById=NNNN / ctl:ruleRemoveTargetById=NNNN;ARGS:field), scoped to the URI that needs them.

# 1000: engine off for RP's own addresses, this box and the Tailscale tailnet - never WAF the owner.
SecRule REMOTE_ADDR "@ipMatch 127.0.0.1,::1,81.103.25.79,81.129.151.215,2a00:23c4:1229:f801::/64,178.62.75.145,188.166.137.38,2a03:b0c0:1:e0:0:1:b4e7:8001,100.64.0.0/10,fd7a:115c:a1e0::/48" \
    "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"

# 1100: a request whose Host header is a bare IP address is a scanner, not a visitor (security.txt excepted).
SecRule REQUEST_HEADERS:Host "@rx ^[\d.:\[\]]+(?::\d+)?$" \
    "id:1100,phase:1,deny,status:403,log,msg:'Blocked: Host header is a numeric IP address',tag:'custom/ip-host-block',chain"
    SecRule REQUEST_URI "!@rx ^/(\.well-known/)?security\.txt($|\?)" "t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"

# 1400: probes for a .claude directory / .claude.json (AI-tool config harvesting).
SecRule REQUEST_FILENAME "@rx (?:^|/)\.claude(?:\.json)?(?:/|$)" \
    "id:1400,phase:1,deny,status:404,log,t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,msg:'Blocked: .claude directory probe',tag:'custom/claude-dir-block'"
