{% extends "base.html" %}
{% block title %}{{ post['title'] }} — {{ site }}{% endblock %}
{% block content %}
<article class="entry">
  <header>
    {% if post['status'] != 'published' %}<p class="badge">Draft</p>{% endif %}
    <h1>{{ post['title'] }}</h1>
  </header>
  <div class="body">{{ html|safe }}</div>
  {% if is_admin %}<p class="editlink"><a href="{{ url_for('edit', post_id=post['id']) }}">Edit this page</a></p>{% endif %}
</article>
{% endblock %}
