; The 2010 code reads DST flag variables that are only set when a zone is in summer time, which PHP 8 reports as
; "Undefined variable" warnings on every visit (the old host logged 66 MB of them). The source is kept exactly as
; it was, so those two classes are silenced for this folder only; errors are still logged.
error_reporting = E_ALL & ~E_WARNING & ~E_DEPRECATED
